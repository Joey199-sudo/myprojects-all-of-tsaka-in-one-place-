<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather Forecast Demo</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>
        <span class="weather-icon">☀️</span><br />
        Currently 21°C in Johannesburg<br/>
        <span class="weather-deg"><span class="min-weather">13°</span> /23°</span>
      </h1>
      <div class="forecast">
        <div class="daily">
          <h3>🌧️ Tomorrow</h3>
          <p>10°/ 22°</p>
        </div>

        <div class="daily">
          <h3>☀️Saturday</h3>
          <p>20°/ 35°</p>
        </div>

        <div class="daily">
          <h3>⛅Sunday</h3>
          <p>25°/ 42°</p>
        </div>
      </div>
      <div class="btn">
        <button class="submit">Change City</button>
      </div>
    </div>
    <footer class="footer">
      <p>Coded by Joey M &copy; 2025</p>
  </body>
</html>
